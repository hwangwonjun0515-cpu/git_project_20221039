<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로또생성기</title>
  <style>
    /*
      디자인 개요
      화면의 모든 빛 알갱이가 가운데 구슬로 천천히 빨려 들어가도록 만들어,
      보는 사람의 시선이 저절로 버튼에 모이게 한다.
      버튼을 누르면 빛이 터져 나가고, 그 구슬에서 번호 공 6개가 떠오른다.
    */

    /* 페이지 전체에서 함께 쓰는 색과 크기 */
    :root {
      --night: #071320;       /* 바탕이 되는 깊은 밤바다 색 */
      --mint: #7ff0d8;        /* 오로라의 민트빛 */
      --lilac: #b69cff;       /* 오로라의 연보랏빛 */
      --peach: #ffc1a8;       /* 오로라의 복숭앗빛 */
      --pearl: #f4f7ff;       /* 제목과 강조 글자에 쓰는 진주색 */
      --soft: #b9c8da;        /* 설명 글자에 쓰는 흐린 색 */
      --ink: #0b1a2b;         /* 밝은 구슬과 공 위에 쓰는 진한 글자색 */
      --orb-size: clamp(150px, 26vmin, 210px); /* 가운데 구슬 버튼의 지름 */
      --chart-surface: rgb(11 22 38 / 0.86);   /* 움직이는 배경 위에서도 그래프가 읽히게 까는 판 */
      --chart-line: rgb(244 247 255 / 0.16);   /* 그래프 판의 테두리 색 */
      --bar-top: #5fe0c5;     /* 추천 후보 번호의 막대 색 */
      --bar-rest: #6e7f9c;    /* 나머지 번호의 막대 색 */
      --row-drawn: rgb(255 193 168 / 0.22);    /* 이번에 뽑힌 번호의 줄 배경 */
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 24px 16px;
      overflow-x: hidden;
      background: var(--night);
      color: var(--pearl);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    /* 맨 뒤 층: 흐릿한 빛 덩어리 세 개가 느리게 떠다니는 오로라 */
    .aurora {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }

    .aurora i {
      position: absolute;
      width: 62vmax;
      height: 62vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.42;
      mix-blend-mode: screen;
    }

    .aurora i:nth-child(1) {
      top: -30%;
      left: -18%;
      background: var(--mint);
      animation: drift-one 27s ease-in-out infinite alternate;
    }

    .aurora i:nth-child(2) {
      right: -22%;
      bottom: -34%;
      background: var(--lilac);
      animation: drift-two 33s ease-in-out infinite alternate;
    }

    .aurora i:nth-child(3) {
      top: 12%;
      left: 26%;
      width: 44vmax;
      height: 44vmax;
      background: var(--peach);
      opacity: 0.2;
      animation: drift-three 21s ease-in-out infinite alternate;
    }

    /* 중간 층: 빛 알갱이와 물결을 그리는 캔버스 */
    #sky {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 맨 앞 층의 바깥 틀: 왼쪽에 뽑기 화면, 오른쪽에 그래프를 놓는다 */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, 420px);
      gap: clamp(24px, 4vw, 56px);
      align-items: center;
      width: min(100%, 1120px);
    }

    /* 왼쪽 영역: 제목, 공, 버튼을 세로로 쌓는다 */
    main {
      display: grid;
      justify-items: center;
      gap: clamp(20px, 4.5vh, 40px);
      min-width: 0;
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      padding-left: 0.42em; /* 글자 사이 간격 때문에 왼쪽으로 치우치는 것을 보정한다 */
      font-size: clamp(1.25rem, 3.4vw, 1.625rem);
      font-weight: 400;
      letter-spacing: 0.42em;
      text-shadow: 0 0 24px var(--lilac);
    }

    /* 오로라가 글자 뒤로 지나가도 읽을 수 있도록 어두운 그림자를 깐다 */
    .lead,
    .count,
    .notes {
      text-shadow: 0 1px 10px var(--night);
    }

    /* 번호의 근거와 확률 안내 문구 */
    .notes {
      display: grid;
      gap: 4px;
      max-width: 34em;
      color: var(--soft);
      font-size: 0.8125rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .notes p {
      margin: 0;
    }

    .lead {
      margin: 0;
      color: var(--soft);
      font-size: 0.9375rem;
    }

    /* 번호 공 6개가 놓이는 줄. 비어 있어도 높이를 유지해 버튼 위치가 흔들리지 않는다 */
    #ballList {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(6px, 2vw, 14px);
      width: 100%;
      min-height: clamp(50px, 14vw, 84px);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .ball {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 26%, #ffffff 0%, var(--ball-color) 38%, var(--ball-edge) 100%);
      box-shadow: 0 0 26px -4px var(--ball-color), inset 0 -6px 12px rgb(0 0 0 / 0.12);
      color: var(--ink);
      font-size: clamp(1rem, 4.4vw, 1.625rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      animation:
        rise 0.85s cubic-bezier(0.2, 1.1, 0.3, 1) calc(var(--order) * 110ms) backwards,
        float 5s ease-in-out calc(var(--order) * -0.8s) infinite alternate;
    }

    /* 번호대별 공 색. 실제 로또 공의 색 구분을 파스텔로 옮겼다 */
    .ball.range-1 { --ball-color: #ffe08a; --ball-edge: #d99a2b; } /* 1~10 노랑 */
    .ball.range-2 { --ball-color: #9fd0ff; --ball-edge: #4f86d9; } /* 11~20 파랑 */
    .ball.range-3 { --ball-color: #ffa8b5; --ball-edge: #d9587a; } /* 21~30 빨강 */
    .ball.range-4 { --ball-color: #cfd5e3; --ball-edge: #7d89a3; } /* 31~40 회색 */
    .ball.range-5 { --ball-color: #a6f0b8; --ball-edge: #3fae72; } /* 41~45 초록 */

    /* 번호 뽑기 버튼: 숨 쉬듯 커졌다 작아지는 진주 구슬 */
    #drawButton {
      position: relative;
      width: var(--orb-size);
      height: var(--orb-size);
      border: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 26%, #ffffff 0%, #e4f6ff 20%, #c9baff 52%, #84ead6 80%, #5a79c4 100%);
      box-shadow: 0 0 60px 6px rgb(182 156 255 / 0.55), inset 0 -14px 30px rgb(30 40 110 / 0.25);
      color: var(--ink);
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      translate: var(--pull-x, 0px) var(--pull-y, 0px); /* 마우스 쪽으로 살짝 끌려오는 움직임 */
      transition: translate 0.35s ease-out, transform 0.14s ease-out, box-shadow 0.3s;
      animation: breathe 4.2s ease-in-out infinite;
    }

    /*
      구슬 표면과 둘레를 천천히 도는 무지갯빛.
      버튼이 자기만의 층을 만들기 때문에 z-index: -1이어도 버튼 바탕 위, 글자 아래에 그려진다.
    */
    #drawButton::before {
      content: "";
      position: absolute;
      inset: -16px;
      z-index: -1;
      border-radius: 50%;
      background: conic-gradient(var(--mint), var(--lilac), var(--peach), var(--mint));
      filter: blur(16px);
      opacity: 0.8;
      animation: spin 9s linear infinite;
    }

    #drawButton:hover {
      box-shadow: 0 0 96px 18px rgb(182 156 255 / 0.8), inset 0 -14px 30px rgb(30 40 110 / 0.25);
    }

    #drawButton:hover::before {
      opacity: 1;
      animation-duration: 3s;
    }

    #drawButton:active {
      transform: scale(0.9);
    }

    #drawButton:focus-visible,
    #resetButton:focus-visible {
      outline: 3px solid var(--pearl);
      outline-offset: 6px;
    }

    /* 생성 횟수와 초기화 버튼이 놓이는 줄 */
    .panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 20px;
    }

    .count {
      margin: 0;
      color: var(--soft);
    }

    .count strong {
      color: var(--pearl);
      font-size: 1.375rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #resetButton {
      padding: 9px 20px;
      border: 1px solid rgb(244 247 255 / 0.4);
      border-radius: 999px;
      background: rgb(244 247 255 / 0.08);
      color: var(--pearl);
      font-family: inherit;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #resetButton:hover {
      background: rgb(244 247 255 / 0.2);
    }

    /*
      번호별 출현 횟수 그래프.
      화면 높이에 맞춰 줄 높이를 정해서 45줄이 한 화면에 들어오게 한다.
      214px는 그래프 줄을 뺀 제목, 범례, 여백의 높이를 합한 값이다.
    */
    .chart-panel {
      --row-height: clamp(12px, calc((100vh - 214px) / 45), 20px);
      display: grid;
      gap: 8px;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid var(--chart-line);
      border-radius: 12px;
      background: var(--chart-surface);
      backdrop-filter: blur(10px);
    }

    .chart-panel h2 {
      margin: 0;
      font-size: 1.0625rem;
      font-weight: 700;
    }

    #chartNote,
    #chartReadout {
      margin: 0;
      color: var(--soft);
      font-size: 0.75rem;
      line-height: 1.4;
    }

    /* 안내 문구의 길이가 바뀌어도 그래프가 위아래로 흔들리지 않게 높이를 고정한다 */
    #chartReadout {
      min-height: 1.4em;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 12px;
      margin: 0;
      padding: 0;
      color: var(--soft);
      font-size: 0.72rem;
      list-style: none;
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 5px;
      border-radius: 2px;
      background: var(--bar-rest);
    }

    .legend .key-top { background: var(--bar-top); }
    .legend .key-drawn { background: var(--row-drawn); box-shadow: 0 0 0 1px var(--peach); }
    .legend .key-average { width: 2px; border-radius: 0; background: var(--pearl); }

    /* 번호, 막대, 횟수를 같은 세 칸에 맞춘다. 눈금 줄도 같은 칸을 쓴다 */
    .chart-axis,
    .chart-row {
      display: grid;
      grid-template-columns: 1.9em minmax(0, 1fr) 2.1em;
      gap: 6px;
      align-items: center;
      font-size: 0.6875rem;
      font-variant-numeric: tabular-nums;
    }

    .chart-ticks {
      display: flex;
      justify-content: space-between;
      color: var(--soft);
    }

    #chartRows {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .chart-row {
      height: var(--row-height);
      border-radius: 2px;
      color: var(--soft);
    }

    .chart-row.is-top {
      color: var(--pearl);
      font-weight: 700;
    }

    .chart-row:hover,
    .chart-row:focus {
      outline: 1px solid var(--pearl);
      outline-offset: -1px;
    }

    .chart-row.is-drawn {
      background: var(--row-drawn);
    }

    .chart-number,
    .chart-count {
      text-align: right;
    }

    .chart-track {
      position: relative;
      display: flex;
      align-items: center;
      height: 100%;
    }

    /* 각 줄의 짧은 선이 위아래로 이어져 평균선 하나가 된다 */
    .chart-track::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 var(--average);
      width: 1px;
      background: var(--pearl);
      opacity: 0.8;
    }

    .chart-bar {
      width: var(--share);
      height: calc(var(--row-height) - 5px);
      border-radius: 0 4px 4px 0;
      background: var(--bar-rest);
    }

    .is-top .chart-bar {
      background: var(--bar-top);
    }

    /* 공이 구슬 위치에서 자기 자리로 떠오르는 움직임 */
    @keyframes rise {
      from {
        opacity: 0;
        scale: 0.2;
        translate: var(--from-x) var(--from-y);
      }
    }

    /* 자리를 잡은 공이 물에 뜬 것처럼 위아래로 흔들리는 움직임 */
    @keyframes float {
      from { transform: translateY(-4px); }
      to { transform: translateY(4px); }
    }

    @keyframes breathe {
      0%, 100% { scale: 1; }
      50% { scale: 1.05; }
    }

    @keyframes spin {
      to { rotate: 360deg; }
    }

    @keyframes drift-one {
      to { transform: translate(24vw, 16vh) scale(1.2); }
    }

    @keyframes drift-two {
      to { transform: translate(-26vw, -18vh) scale(0.85); }
    }

    @keyframes drift-three {
      to { transform: translate(-16vw, 22vh) scale(1.3); }
    }

    /* 옆에 나란히 놓을 자리가 없는 화면에서는 그래프를 아래로 내린다 */
    @media (max-width: 1000px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .chart-panel {
        --row-height: 17px;
      }
    }

    /* 컴퓨터에서 애니메이션 줄이기를 켠 사람에게는 움직임을 멈춘다 */
    @media (prefers-reduced-motion: reduce) {
      .aurora i,
      .ball,
      #drawButton,
      #drawButton::before {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <!-- 움직이는 배경: 오로라 빛 덩어리 세 개 -->
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <!-- 움직이는 배경: 빛 알갱이와 물결을 그리는 캔버스 -->
  <canvas id="sky" aria-hidden="true"></canvas>

  <div class="layout">
  <main>
    <header>
      <h1>로또생성기</h1>
      <p class="lead">역대 1,248회 추첨에서 가장 많이 나온 번호 14개 중 6개를 뽑습니다.</p>
    </header>

    <!-- 뽑힌 번호 공이 들어가는 자리 -->
    <ol id="ballList" aria-label="뽑힌 번호" aria-live="polite"></ol>

    <button id="drawButton" type="button">번호 뽑기</button>

    <div class="panel">
      <p class="count">생성 횟수 <strong id="countValue">0</strong>회</p>
      <button id="resetButton" type="button">초기화</button>
    </div>

    <!-- 번호의 근거와 당첨 확률 안내 -->
    <div class="notes">
      <p id="candidates"></p>
      <p>과거에 많이 나온 번호가 앞으로 더 잘 나오는 것은 아닙니다. 어떤 조합이든 1등 확률은 8,145,060분의 1로 같습니다.</p>
    </div>
  </main>

  <!-- 1~45번의 역대 출현 횟수 그래프 -->
  <aside class="chart-panel" aria-labelledby="chartTitle">
    <h2 id="chartTitle">번호별 역대 출현 횟수</h2>
    <p id="chartNote"></p>
    <ul class="legend">
      <li><i class="key-top"></i>추천 후보</li>
      <li><i></i>나머지 번호</li>
      <li><i class="key-average"></i><span id="averageLabel"></span></li>
      <li><i class="key-drawn"></i>이번에 뽑힌 번호</li>
    </ul>
    <div class="chart-axis" aria-hidden="true">
      <span></span>
      <span class="chart-ticks" id="chartTicks"></span>
      <span></span>
    </div>
    <ol id="chartRows"></ol>
    <p id="chartReadout"></p>
  </aside>
  </div>

  <script>
    /* ===== 1. 로또 규칙과 역대 기록 ===== */

    // 로또 번호 중 가장 작은 번호. PAST_COUNTS의 첫 칸이 이 번호의 기록이다
    const MIN_NUMBER = 1;
    // 한 번에 뽑는 번호의 개수
    const PICK_COUNT = 6;
    // 추천 후보로 쓸 번호의 개수. 공동 15위가 5개라서 임의로 자르지 않도록 14위까지만 쓴다
    const TOP_SIZE = 14;
    // 역대 기록에 포함된 마지막 회차와 추첨일. 새 회차가 나와도 자동으로 바뀌지 않는다
    const DATA_LAST_DRAW = "제1248회(2026년 10월 31일)";
    // 1번부터 45번까지 번호별 역대 당첨 횟수. 보너스 번호는 세지 않았다
    const PAST_COUNTS = [
      171, 157, 172, 164, 154, 166, 171, 159, 137, 163, // 1~10번
      168, 180, 184, 173, 170, 172, 171, 181, 171, 172, // 11~20번
      168, 148, 150, 169, 154, 166, 183, 159, 156, 158, // 21~30번
      171, 147, 175, 187, 163, 166, 174, 175, 168, 174, // 31~40번
      151, 161, 167, 166, 176                           // 41~45번
    ];
    // 역대 당첨 횟수가 가장 많은 번호들. 번호는 이 안에서만 뽑는다
    const TOP_NUMBERS = findTopNumbers();
    // 번호 하나의 평균 출현 횟수. 그래프의 평균선 위치가 된다
    const AVERAGE_COUNT = PAST_COUNTS.reduce((sum, count) => sum + count, 0) / PAST_COUNTS.length;
    // 그래프 가로축의 끝값. 차이를 부풀리지 않도록 막대는 항상 0에서 시작한다
    const CHART_MAX = 200;
    // 그래프 위쪽에 표시할 눈금 값들
    const CHART_TICKS = [0, 100, CHART_MAX];
    // 그래프에서 아무 줄도 가리키지 않을 때 보여 줄 안내 문구
    const READOUT_HINT = "줄에 마우스를 올리면 평균과의 차이를 보여 줍니다.";

    /* ===== 2. 배경 애니메이션 설정 ===== */

    // 빛 알갱이 1개가 차지하는 화면 넓이(제곱픽셀). 작을수록 알갱이가 많아진다
    const AREA_PER_PARTICLE = 8000;
    // 빛 알갱이의 최소 개수. 작은 화면에서도 배경이 비어 보이지 않게 한다
    const MIN_PARTICLES = 70;
    // 빛 알갱이의 최대 개수. 큰 화면에서 컴퓨터가 느려지지 않게 한다
    const MAX_PARTICLES = 240;
    // 빛 알갱이에 쓰는 색 목록. CSS의 오로라 색과 맞춘다
    const PARTICLE_COLORS = ["#7ff0d8", "#b69cff", "#ffc1a8", "#f4f7ff"];
    // 이전 그림을 지우는 강도. 낮을수록 알갱이의 꼬리가 길게 남는다
    const TRAIL_FADE = 0.16;
    // 구슬에서 물결이 저절로 퍼져 나오는 간격(프레임 단위)
    const RING_INTERVAL = 150;
    // 평소에 빛 알갱이가 구슬로 끌려가는 힘
    const CALM_PULL = 1;
    // 마우스를 구슬에 올렸을 때 빛 알갱이가 끌려가는 힘
    const HOVER_PULL = 3.5;
    // 구슬이 마우스 쪽으로 끌려오기 시작하는 거리(픽셀)
    const MAGNET_RANGE = 240;
    // 구슬이 마우스를 따라 움직이는 비율. 0.1이면 마우스와의 거리의 10%만큼 움직인다
    const MAGNET_STRENGTH = 0.1;

    /* ===== 3. 화면 요소 ===== */

    // 번호 공이 들어가는 목록
    const ballList = document.getElementById("ballList");
    // 번호 뽑기 버튼(가운데 구슬)
    const drawButton = document.getElementById("drawButton");
    // 초기화 버튼
    const resetButton = document.getElementById("resetButton");
    // 생성 횟수 숫자가 표시되는 곳
    const countValue = document.getElementById("countValue");
    // 추천 후보 번호가 표시되는 곳
    const candidatesText = document.getElementById("candidates");
    // 그래프의 번호별 줄이 들어가는 목록
    const chartRows = document.getElementById("chartRows");
    // 그래프 아래의 자세한 설명 문구
    const chartReadout = document.getElementById("chartReadout");
    // 배경을 그리는 캔버스
    const canvas = document.getElementById("sky");
    // 캔버스에 그림을 그릴 때 쓰는 도구
    const ctx = canvas.getContext("2d");
    // 사용자가 컴퓨터 설정에서 애니메이션 줄이기를 켰는지 알려 주는 값
    const calmMotion = matchMedia("(prefers-reduced-motion: reduce)");

    /* ===== 4. 계속 바뀌는 값 ===== */

    // 지금까지 번호를 뽑은 횟수
    let drawCount = 0;
    // 캔버스의 화면상 너비(픽셀)
    let skyWidth = 0;
    // 캔버스의 화면상 높이(픽셀)
    let skyHeight = 0;
    // 구슬 중심의 가로 위치
    let orbX = 0;
    // 구슬 중심의 세로 위치
    let orbY = 0;
    // 구슬의 반지름
    let orbRadius = 0;
    // 빛 알갱이가 처음 나타나는 가장 먼 거리(구슬 중심 기준)
    let farRadius = 0;
    // 지금 빛 알갱이에 걸린 끌림의 세기
    let pull = CALM_PULL;
    // 끌림이 도달해야 할 목표 세기. pull이 이 값으로 서서히 따라간다
    let targetPull = CALM_PULL;
    // 버튼을 누른 순간 알갱이를 밀어내는 힘. 시간이 지나면 0으로 줄어든다
    let burst = 0;
    // 다음 물결이 나올 때까지 쌓는 시간(프레임 단위)
    let ringTimer = 0;
    // 직전 프레임이 그려진 시각. 화면 주사율과 상관없이 속도를 맞추는 데 쓴다
    let lastFrameTime = 0;
    // 화면에 있는 모든 빛 알갱이
    let particles = [];
    // 화면에 있는 모든 물결
    let rings = [];

    /* ===== 5. 번호 뽑기 ===== */

    /**
     * 0 이상 limit 미만의 정수를 무작위로 하나 돌려준다.
     * 브라우저에 내장된 암호용 난수를 쓰고, 특정 숫자가 더 자주 나오지 않도록
     * 나누어떨어지지 않는 구간에 걸린 값은 버리고 다시 뽑는다.
     * @param {number} limit 뽑을 수 있는 숫자의 개수
     * @returns {number} 무작위 정수
     */
    function randomInt(limit) {
      // 이 값 이상의 난수는 편향을 만들기 때문에 버린다
      const ceiling = 2 ** 32 - 2 ** 32 % limit;
      // 난수 하나를 담을 칸
      const value = new Uint32Array(1);
      do {
        crypto.getRandomValues(value);
      } while (value[0] >= ceiling);
      return value[0] % limit;
    }

    /**
     * 역대 당첨 횟수가 많은 순서로 번호를 줄 세워 위에서 TOP_SIZE개를 돌려준다.
     * 과거 기록을 정리할 뿐이며, 이 번호들의 앞으로의 당첨 확률이 더 높다는 뜻은 아니다.
     * @returns {number[]} 당첨 횟수가 많은 순서의 번호들
     */
    function findTopNumbers() {
      return PAST_COUNTS
        .map((count, index) => ({ number: MIN_NUMBER + index, count }))
        .sort((a, b) => b.count - a.count)
        .slice(0, TOP_SIZE)
        .map((item) => item.number);
    }

    /**
     * 역대 최다 출현 번호 중에서 중복 없는 번호 6개를 뽑아 오름차순으로 돌려준다.
     * 후보 번호 목록에서 뽑은 번호를 바로 빼기 때문에 같은 번호가 다시 나올 수 없다.
     * @returns {number[]} 오름차순으로 정렬된 번호 6개
     */
    function pickNumbers() {
      // 아직 뽑히지 않은 후보 번호들. 원본을 지우지 않도록 복사해서 쓴다
      const candidates = [...TOP_NUMBERS];

      // 뽑힌 번호들
      const picked = [];
      while (picked.length < PICK_COUNT) {
        // 후보 중 이번에 고를 번호의 위치
        const index = randomInt(candidates.length);
        picked.push(candidates.splice(index, 1)[0]);
      }

      return picked.sort((a, b) => a - b);
    }

    /* ===== 6. 화면에 공 표시 ===== */

    /**
     * 번호가 속한 구간을 1~5로 돌려준다. 공의 색을 정하는 데 쓴다.
     * 예: 7은 1, 14는 2, 45는 5
     * @param {number} number 공에 적힌 번호
     * @returns {number} 구간 번호
     */
    function rangeOf(number) {
      return Math.ceil(number / 10);
    }

    /**
     * 번호가 적힌 공 요소를 하나 만든다.
     * @param {number} number 공에 적을 번호
     * @param {number} order 왼쪽에서 몇 번째 공인지(0부터). 떠오르는 순서에 쓴다
     * @returns {HTMLLIElement} 완성된 공
     */
    function createBall(number, order) {
      // 공 하나를 나타내는 목록 항목
      const ball = document.createElement("li");
      ball.className = `ball range-${rangeOf(number)}`;
      ball.style.setProperty("--order", order);
      ball.textContent = number;
      return ball;
    }

    /**
     * 공이 구슬에서 출발하도록, 각 공의 자리에서 구슬까지의 거리를 계산해 넣는다.
     * 계산한 값은 CSS의 rise 애니메이션이 출발 위치로 사용한다.
     */
    function startBallsFromOrb() {
      for (const ball of ballList.children) {
        // 공 자리의 위치와 크기
        const box = ball.getBoundingClientRect();
        ball.style.setProperty("--from-x", `${orbX - (box.left + box.width / 2)}px`);
        ball.style.setProperty("--from-y", `${orbY - (box.top + box.height / 2)}px`);
      }
    }

    /**
     * 기존 공을 지우고 새 번호 공을 화면에 놓는다.
     * @param {number[]} numbers 표시할 번호들
     */
    function showBalls(numbers) {
      ballList.replaceChildren(...numbers.map(createBall));
      startBallsFromOrb();
      markDrawnRows(numbers);
    }

    /** 현재 생성 횟수를 화면에 표시한다. */
    function updateCount() {
      countValue.textContent = drawCount;
    }

    /** 추천 후보 번호와 기록의 기준 회차를 화면에 표시한다. */
    function showCandidates() {
      // 읽기 쉽도록 작은 번호부터 늘어놓은 후보 번호들
      const sortedNumbers = [...TOP_NUMBERS].sort((a, b) => a - b);
      candidatesText.textContent = `${DATA_LAST_DRAW}까지의 최다 출현 번호: ${sortedNumbers.join(", ")}`;
    }

    /* ===== 6-1. 번호별 출현 횟수 그래프 ===== */

    /**
     * 그래프의 한 줄을 만든다. 번호, 막대, 횟수가 왼쪽부터 놓인다.
     * @param {number} count 이 번호의 역대 출현 횟수
     * @param {number} index PAST_COUNTS 안에서의 위치(0부터)
     * @returns {HTMLLIElement} 완성된 줄
     */
    function createChartRow(count, index) {
      // 이 줄이 나타내는 로또 번호
      const number = MIN_NUMBER + index;
      // 그래프의 한 줄 전체
      const row = document.createElement("li");
      // 왼쪽의 번호 글자
      const label = document.createElement("span");
      // 가운데의 막대 자리. 평균선도 여기에 그려진다
      const track = document.createElement("span");
      // 출현 횟수만큼 길어지는 막대
      const bar = document.createElement("span");
      // 오른쪽의 횟수 글자
      const value = document.createElement("span");

      row.className = "chart-row";
      row.classList.toggle("is-top", TOP_NUMBERS.includes(number));
      row.dataset.number = number;
      row.tabIndex = 0;
      row.setAttribute("aria-label", `${number}번 ${count}회`);
      row.style.setProperty("--share", `${(count / CHART_MAX) * 100}%`);

      label.className = "chart-number";
      label.textContent = number;
      track.className = "chart-track";
      bar.className = "chart-bar";
      value.className = "chart-count";
      value.textContent = count;

      track.append(bar);
      row.append(label, track, value);
      return row;
    }

    /** 그래프의 제목 아래 문구, 범례, 눈금, 번호별 줄을 모두 그린다. */
    function renderChart() {
      document.getElementById("chartNote").textContent = `${DATA_LAST_DRAW}까지, 보너스 번호 제외`;
      document.getElementById("averageLabel").textContent = `평균 ${AVERAGE_COUNT.toFixed(1)}회`;

      document.getElementById("chartTicks").replaceChildren(...CHART_TICKS.map((tick) => {
        // 눈금 숫자 하나
        const label = document.createElement("span");
        label.textContent = tick;
        return label;
      }));

      chartRows.style.setProperty("--average", `${(AVERAGE_COUNT / CHART_MAX) * 100}%`);
      chartRows.replaceChildren(...PAST_COUNTS.map(createChartRow));
      chartReadout.textContent = READOUT_HINT;
    }

    /**
     * 그래프에서 이번에 뽑힌 번호의 줄에 표시를 남긴다.
     * @param {number[]} numbers 표시할 번호들. 빈 배열이면 표시를 모두 지운다
     */
    function markDrawnRows(numbers) {
      for (const row of chartRows.children) {
        row.classList.toggle("is-drawn", numbers.includes(Number(row.dataset.number)));
      }
    }

    /**
     * 마우스나 키보드가 가리키는 줄의 자세한 내용을 그래프 아래에 보여 준다.
     * @param {Event} event 마우스 이동 또는 키보드 선택 정보
     */
    function showReadout(event) {
      // 지금 가리키는 그래프 줄
      const row = event.target.closest(".chart-row");
      if (!row) return;

      // 가리키는 줄의 번호
      const number = Number(row.dataset.number);
      // 이 번호의 역대 출현 횟수
      const count = PAST_COUNTS[number - MIN_NUMBER];
      // 평균과의 차이
      const gap = count - AVERAGE_COUNT;
      // 평균보다 많은지 적은지를 나타내는 말
      const direction = gap >= 0 ? "많음" : "적음";
      chartReadout.textContent = `${number}번: ${count}회, 평균보다 ${Math.abs(gap).toFixed(1)}회 ${direction}`;
    }

    /* ===== 7. 버튼 동작 ===== */

    /** 번호 뽑기 버튼을 눌렀을 때 실행한다. 번호를 뽑고 횟수를 1 올린다. */
    function handleDraw() {
      showBalls(pickNumbers());
      drawCount += 1;
      updateCount();
      releaseBurst();
    }

    /** 초기화 버튼을 눌렀을 때 실행한다. 공을 모두 지우고 횟수를 0으로 되돌린다. */
    function handleReset() {
      ballList.replaceChildren();
      markDrawnRows([]);
      drawCount = 0;
      updateCount();
    }

    /* ===== 8. 움직이는 배경 ===== */

    /**
     * 빛 알갱이 하나에 시작 값을 넣는다. 새로 만들 때와 구슬에 빨려 들어간 뒤에 쓴다.
     * @param {object} particle 값을 넣을 알갱이
     * @param {number} radius 구슬 중심에서 시작할 거리
     */
    function placeParticle(particle, radius) {
      particle.radius = radius;                        // 구슬 중심에서의 거리
      particle.angle = Math.random() * Math.PI * 2;    // 구슬 중심 기준의 각도
      particle.spin = 0.0012 + Math.random() * 0.0018; // 구슬 주위를 도는 속도
      particle.fall = 0.18 + Math.random() * 0.34;     // 구슬로 다가가는 속도
      particle.size = 0.6 + Math.random() * 1.6;       // 알갱이의 반지름
      particle.color = PARTICLE_COLORS[randomInt(PARTICLE_COLORS.length)]; // 알갱이의 색
    }

    /** 화면 넓이에 맞는 개수만큼 빛 알갱이를 만들어 화면 곳곳에 흩어 놓는다. */
    function createParticles() {
      // 이 화면에 알맞은 알갱이 개수
      const count = Math.min(MAX_PARTICLES, Math.max(MIN_PARTICLES, Math.round((skyWidth * skyHeight) / AREA_PER_PARTICLE)));
      particles = Array.from({ length: count }, () => {
        // 새 알갱이
        const particle = {};
        placeParticle(particle, orbRadius + Math.random() * (farRadius - orbRadius));
        return particle;
      });
    }

    /**
     * 빛 알갱이 하나를 소용돌이 모양으로 움직인다.
     * 구슬에 가까울수록 빠르게 돌고, 구슬에 닿으면 바깥에서 다시 나타난다.
     * @param {object} particle 움직일 알갱이
     * @param {number} frames 지난 프레임 수
     */
    function moveParticle(particle, frames) {
      // 구슬에 가까울수록 커지는 회전 배율
      const closeness = Math.min(farRadius / particle.radius, 6);
      particle.angle += particle.spin * closeness * pull * frames;
      particle.radius += (burst * 16 - particle.fall * pull) * frames;

      if (particle.radius < orbRadius * 0.8 || particle.radius > farRadius + 80) {
        placeParticle(particle, farRadius);
      }
    }

    /**
     * 빛 알갱이 하나를 캔버스에 그린다. 바깥에서 막 나타난 알갱이는 흐리게 그린다.
     * @param {object} particle 그릴 알갱이
     */
    function drawParticle(particle) {
      ctx.globalAlpha = Math.min(1, (farRadius + 80 - particle.radius) / 200);
      ctx.fillStyle = particle.color;
      ctx.beginPath();
      ctx.arc(
        orbX + Math.cos(particle.angle) * particle.radius,
        orbY + Math.sin(particle.angle) * particle.radius,
        particle.size,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    /**
     * 구슬에서 시작하는 물결을 하나 추가한다.
     * @param {number} speed 물결이 퍼지는 속도
     * @param {number} strength 물결의 처음 밝기(0~1)
     */
    function addRing(speed, strength) {
      rings.push({ radius: orbRadius, speed, strength });
    }

    /**
     * 모든 물결을 넓히고 흐리게 만든 뒤 그린다. 완전히 흐려진 물결은 없앤다.
     * @param {number} frames 지난 프레임 수
     */
    function updateRings(frames) {
      ringTimer += frames;
      if (ringTimer >= RING_INTERVAL) {
        ringTimer = 0;
        addRing(0.7, 0.32);
      }

      rings = rings.filter((ring) => ring.strength > 0);
      ctx.strokeStyle = PARTICLE_COLORS[1];
      ctx.lineWidth = 1.2;
      for (const ring of rings) {
        ring.radius += ring.speed * frames;
        ring.strength -= 0.0016 * frames;
        ctx.globalAlpha = Math.max(0, ring.strength);
        ctx.beginPath();
        ctx.arc(orbX, orbY, ring.radius, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    /**
     * 배경을 한 프레임 그린다.
     * 이전 그림을 전부 지우지 않고 조금만 흐리게 만들어 알갱이의 꼬리가 남게 한다.
     * @param {number} frames 지난 프레임 수. 60Hz 화면에서는 1이다
     */
    function renderFrame(frames) {
      pull += (targetPull - pull) * 0.05 * frames;
      burst *= 0.93 ** frames;

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = `rgba(0, 0, 0, ${TRAIL_FADE})`;
      ctx.fillRect(0, 0, skyWidth, skyHeight);

      ctx.globalCompositeOperation = "lighter";
      updateRings(frames);
      for (const particle of particles) {
        moveParticle(particle, frames);
        drawParticle(particle);
      }
    }

    /**
     * 화면을 새로 그릴 때마다 브라우저가 호출하는 반복 함수.
     * @param {number} now 현재 시각(밀리초)
     */
    function animate(now) {
      // 직전 프레임 뒤로 지난 프레임 수. 탭을 다녀온 뒤 크게 튀지 않도록 3으로 제한한다
      const frames = Math.min((now - lastFrameTime) / (1000 / 60), 3);
      lastFrameTime = now;
      renderFrame(frames);
      requestAnimationFrame(animate);
    }

    /** 버튼을 누른 순간 빛이 터져 나가도록 알갱이를 밀어내고 큰 물결을 만든다. */
    function releaseBurst() {
      burst = 1;
      addRing(6, 0.9);
      addRing(3.6, 0.6);
    }

    /**
     * 구슬의 현재 위치를 재서 소용돌이의 중심으로 삼는다.
     * 구슬이 화면 가운데에 있지 않아도 가장 먼 모서리까지 알갱이가 닿게 한다.
     */
    function measureOrb() {
      // 구슬의 현재 위치와 크기
      const orbBox = drawButton.getBoundingClientRect();

      orbX = orbBox.left + orbBox.width / 2;
      orbY = orbBox.top + orbBox.height / 2;
      orbRadius = drawButton.offsetWidth / 2;
      farRadius = Math.hypot(Math.max(orbX, skyWidth - orbX), Math.max(orbY, skyHeight - orbY)) + 80;
    }

    /** 창 크기에 맞춰 캔버스 크기와 구슬의 위치를 다시 잰다. */
    function resizeSky() {
      // 선명하게 그리기 위한 화면 배율. 2를 넘으면 그릴 양만 늘어서 제한한다
      const ratio = Math.min(window.devicePixelRatio || 1, 2);

      skyWidth = window.innerWidth;
      skyHeight = window.innerHeight;
      canvas.width = Math.round(skyWidth * ratio);
      canvas.height = Math.round(skyHeight * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      measureOrb();
    }

    /**
     * 마우스가 가까워지면 구슬이 그쪽으로 살짝 끌려오게 한다.
     * @param {PointerEvent} event 마우스 이동 정보
     */
    function pullOrbToPointer(event) {
      // 구슬 중심에서 마우스까지의 가로 거리
      const dx = event.clientX - orbX;
      // 구슬 중심에서 마우스까지의 세로 거리
      const dy = event.clientY - orbY;
      // 범위 안일 때만 움직일 비율. 범위 밖이면 제자리로 돌아간다
      const strength = Math.hypot(dx, dy) < MAGNET_RANGE ? MAGNET_STRENGTH : 0;
      drawButton.style.setProperty("--pull-x", `${dx * strength}px`);
      drawButton.style.setProperty("--pull-y", `${dy * strength}px`);
    }

    /* ===== 9. 시작 ===== */

    drawButton.addEventListener("click", handleDraw);
    resetButton.addEventListener("click", handleReset);

    // 구슬에 마우스를 올리거나 키보드로 선택하면 빛이 더 빠르게 빨려 들어간다
    drawButton.addEventListener("pointerenter", () => { targetPull = HOVER_PULL; });
    drawButton.addEventListener("pointerleave", () => { targetPull = CALM_PULL; });
    drawButton.addEventListener("focus", () => { targetPull = HOVER_PULL; });
    drawButton.addEventListener("blur", () => { targetPull = CALM_PULL; });

    // 그래프에서 마우스나 키보드가 가리키는 줄을 설명하고, 벗어나면 안내 문구로 되돌린다
    chartRows.addEventListener("pointerover", showReadout);
    chartRows.addEventListener("focusin", showReadout);
    chartRows.addEventListener("pointerleave", () => { chartReadout.textContent = READOUT_HINT; });

    window.addEventListener("resize", resizeSky);
    window.addEventListener("scroll", measureOrb, { passive: true });
    window.addEventListener("pointermove", pullOrbToPointer);

    // 글자와 그래프를 먼저 채운다. 화면 배치가 끝나야 구슬의 위치를 정확히 잴 수 있다
    updateCount();
    showCandidates();
    renderChart();
    resizeSky();
    createParticles();

    if (calmMotion.matches) {
      // 움직임을 줄인 환경에서는 소용돌이가 그려진 한 장의 그림으로 멈춘다
      for (let frame = 0; frame < 120; frame++) {
        renderFrame(1);
      }
    } else {
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
